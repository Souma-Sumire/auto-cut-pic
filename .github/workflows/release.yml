name: Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+*'
      - '[0-9]*.[0-9]*.[0-9]*'
      - '*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore AutoCutPic.sln

      - name: Run unit tests
        run: dotnet test AutoCutPic.Tests/AutoCutPic.Tests.csproj -c Release --no-restore

      - name: Publish standalone Windows x64 binary
        run: >
          dotnet publish AutoCutPic.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -p:DebugSymbols=false
          -o publish/standalone/

      - name: Publish framework-dependent Windows x64 binary
        run: >
          dotnet publish AutoCutPic.csproj
          -c Release
          -r win-x64
          --self-contained false
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none
          -p:DebugSymbols=false
          -o publish/framework-dependent/

      - name: Create release zip archives
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          Compress-Archive -Path "publish/standalone/AutoCutPic.exe" -DestinationPath "AutoCutPic-$tag-win-x64-standalone.zip" -Force
          Compress-Archive -Path "publish/framework-dependent/AutoCutPic.exe" -DestinationPath "AutoCutPic-$tag-win-x64-framework-dependent.zip" -Force

      - name: Upload workflow artifacts (non-tag runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: AutoCutPic-${{ github.ref_name }}-win-x64
          path: |
            AutoCutPic-${{ github.ref_name }}-win-x64-standalone.zip
            AutoCutPic-${{ github.ref_name }}-win-x64-framework-dependent.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: AutoCutPic ${{ github.ref_name }}
          files: |
            AutoCutPic-${{ github.ref_name }}-win-x64-standalone.zip
            AutoCutPic-${{ github.ref_name }}-win-x64-framework-dependent.zip
          draft: false
          prerelease: false
          generate_release_notes: true
